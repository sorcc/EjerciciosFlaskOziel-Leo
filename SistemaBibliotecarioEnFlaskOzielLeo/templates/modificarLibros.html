<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    {% extends 'layout.html' %}
    {% block body %}
        <div class="row p-1 m-3 container bg-success border border-white text-white">
            <div class="col-3 p-2 m-2 container-md-4 border border-white text-white">
                <form action="/ActualizarLibro/{{libros.0}}" method="POST">
                    <p>Id:<input type="text" name="id" placeholder="Clave" value="{{ libros.0 }}"></p>
                    <p>Titulo:<input type="text" name="titulo" placeholder="Título de libro" value="{{ libros.1 }}"></p>
                    <p>Autor:<input type="text" name="autor" placeholder="Autor" value="{{ libros.2 }}"></p>
                    <p>Edición:<input type="text" name="edicion" placeholder="Edición" value="{{ libros.3 }}"></p>
                    <p>Año:<input type="text" name="año" placeholder="Año" value="{{ libros.4 }}"></p>
                    <p>Editorial:<input type="text" name="editorial" placeholder="Editorial" value="{{ libros.5 }}"></p>
                    <p>No. de Páginas:<input type="text" name="nopaginas" placeholder="Número de páginas"
                    value="{{ libros.6 }}"></p>
                    <button type="submit" class="btn btn-danger"> Actualizar </button>
                    <a href="/Libros" class="btn btn-secondary"><button type="button">Regresar</button></a>
                </form>
            </div>
        </div>
    {% endblock %}
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
