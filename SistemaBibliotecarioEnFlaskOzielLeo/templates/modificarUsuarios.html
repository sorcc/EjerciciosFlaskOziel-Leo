<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-sRI14kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWlzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
</head>
<body>
    {% extends 'layout.html' %}
    {% block body %}
        <div class="row p-1 m-3 container bg-success border border-white text-white">
            <div class="col-6 p-2 m-2 container-md-4 border border-white text-white">
                <form action="/ActualizarUsuario/{{usuarios.0}}" method="POST">
                    <p>Id:<input type="text" name="id" placeholder="Clave" value="{{ usuarios.0 }}"></p>
                    <p>Nombre:<input type="text" name="nombre" placeholder="Nombre del Usuario" value="{{ usuarios.1 }}"></p>
                    <p>Direccion:<input type="text" name="direccion" placeholder="Dirección del Usuario" value="{{ usuarios.2 }}"></p>
                    <p>Telefono:<input type="text" name="telefono" placeholder="Telefono del Usuario" value="{{ usuarios.3 }}"></p>
                    <p>Correo:<input type="text" name="correo" placeholder="Correo del Usuario" value="{{ usuarios.4 }}"></p>
                    <p>Curp:<input type="text" name="curp" placeholder="Curp del Usuario" value="{{ usuarios.5 }}"></p>
                    <button type="submit" class="btn btn-danger">Actualizar</button>
                    <a href="/Usuarios" class="btn btn-secondary"><button type="button">Regresar</button></a>
                </form>
            </div>
        </div>
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
