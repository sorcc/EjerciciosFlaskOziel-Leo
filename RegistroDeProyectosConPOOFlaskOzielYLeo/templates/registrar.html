{% extends "base.html" %}
{% block titulo %}Registrar proyecto{% endblock %}

{% block contenido %}
    <h1>Registro de un nuevo proyecto</h1>
    <form method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br>
        <label for="responsable">Responsable:</label>
        <input type="text" id="responsable" name="responsable" required><br>
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" required></textarea><br>
        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" required><br>
        <label for="asignatura">Asignatura:</label>
        <input type="text" id="asignatura" name="asignatura" required><br>
        <label for="dias_restantes">Días restantes:</label>
        <input type="number" id="dias_restantes" name="dias_restantes" required><br>
        <button type="submit">Registrar proyecto</button>
    </form>
    <a class="boton" href="/proyectos">Ver proyectos</a>
{% endblock %}
